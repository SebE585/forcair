  # ── Filament 3D (estimé au ratio poids) ────────────────────────
  #
  # Un maker qui reproduit Forcair n'a pas besoin d'acheter 3 bobines
  # complètes (~60€). Estimation du filament réellement consommé par
  # les pièces imprimées, basée sur les temps d'impression observés
  # et un ratio moyen de ~30g/heure en PETG, ~20g/heure en TPU.
  #
  # Prix calculés au ratio : (poids_estimé / 1000g) × prix_bobine.
  # Ajuster selon vos STL, paramètres slicer et taux de remplissage.

  - ref: filament-petg-noir
    sourcier_ref: FIL-001
    name:
      fr: Filament PETG Noir 1.75mm (estimé ~270g consommés)
      en: PETG Black filament 1.75mm (estimated ~270g used)
    qty: 270
    unit: g
    category: Filament 3D
    notes:
      fr: "Hubs roue ×4 (~160g, 4×1h) + supports moteur ×4 (~80g, 4×30min) + supports capteurs (~30g). Ratio : 270g / 1000g × 16.99€ ≈ 4.59€"
      en: "Wheel hubs ×4 (~160g) + motor mounts ×4 (~80g) + sensor brackets (~30g). Ratio: 270g / 1000g × 16.99€ ≈ 4.59€"

  - ref: filament-petg-bleu
    sourcier_ref: FIL-002
    name:

    notes:
      fr: "Capot dôme Forcair (~100g, ~3h impression). Ratio : 100g / 1000g × 18.99€ ≈ 1.90€. Couleur optionnelle — PETG noir fonctionne aussi."
      en: "Forcair dome hood (~100g, ~3h print). Ratio: 100g / 1000g × 18.99€ ≈ 1.90€. Color optional — black PETG works too."

  - ref: filament-tpu-noir
